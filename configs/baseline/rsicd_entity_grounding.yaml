experiment:
  name: clip_rsicd_adapter_entity_grounding_10ep_1e-4

dataset:
  name: rsicd
  image_root: E:/datasets/remote_sensing_captioning/RSICD/images
  train_file:
    - E:/paper3/data/rsicd/rsicd_train.json
  val_file: E:/paper3/data/rsicd/rsicd_val.json
  test_file: E:/paper3/data/rsicd/rsicd_test.json
  entity_index_file: E:/paper3/data/rsicd/entity_prototype/rsicd_entity_span_index.pt
  image_res: 224
  max_words: 30

model:
  name: clip
  backbone: ViT-B-32-quickgelu
  pretrained: openai
  pretrained_local_path: C:/Users/Administrator/.cache/clip/ViT-B-32.pt
  prefer_local_pretrained: true

  init_checkpoint: E:/paper3/outputs/clip_rsicd_10ep/best.pth
  freeze_backbone: true

  visual_adapter_dim: 128
  text_adapter_dim: 64
  grounding_temperature: 0.02

training:
  epochs: 10
  batch_size: 64
  eval_batch_size: 128
  text_batch_size: 256
  num_workers: 8
  eval_every: 1
  entity_loss_weight: 0.1
  log_interval: 50
  early_stop_patience: null
  early_stop_min_delta: 0.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01

scheduler:
  name: linear
  warmup_ratio: 0.05

seed: 42

output:
  root: ./outputs