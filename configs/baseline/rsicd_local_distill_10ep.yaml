experiment:
  name: clip_rsicd_local_distill_10ep

dataset:
  name: rsicd
  image_root: E:/datasets/remote_sensing_captioning/RSICD/images
  train_file:
    - E:/paper3/data/rsicd/rsicd_train.json
  val_file: E:/paper3/data/rsicd/rsicd_val.json
  test_file: E:/paper3/data/rsicd/rsicd_test.json
  entity_index_file: E:/paper3/data/rsicd/entity_prototype/rsicd_entity_span_index.pt
  image_res: 224
  max_words: 30

model:
  name: clip
  backbone: ViT-B-32-quickgelu
  pretrained: openai
  pretrained_local_path: C:/Users/Administrator/.cache/clip/ViT-B-32.pt
  prefer_local_pretrained: true

  # 从已验证有效的 Global-only Adapter best checkpoint 初始化。
  init_checkpoint: E:/paper3/outputs/clip_rsicd_adapter_entity_grounding_10ep_0.0/best.pth
  freeze_backbone: true

  # Global Adapter 结构保持不变，B1 中会被冻结。
  visual_adapter_dim: 128
  text_adapter_dim: 64
  grounding_temperature: 0.02

  # B1 Local Self-Distillation。
  local_image_size: 224
  local_grid_size: 7
  local_num_regions: 2
  local_min_scale: 0.20
  local_max_scale: 0.60

training:
  epochs: 10
  batch_size: 64
  eval_batch_size: 128
  text_batch_size: 256
  num_workers: 8
  eval_every: 1
  log_interval: 50

  # 当前阶段关闭旧 Entity Grounding。
  entity_loss_weight: 0.0

  # B1：只训练 Local Head。
  local_distill_only: true
  local_distill_weight: 1.0

  early_stop_patience: null
  early_stop_min_delta: 0.0

optimizer:
  name: adamw
  lr: 1.0e-4
  weight_decay: 0.01

scheduler:
  name: linear
  warmup_ratio: 0.05

seed: 42

output:
  root: ./outputs
